syntax = "proto3";

package log.v1;

option go_package = "github.com/alderon07/log/api/v1";

message Record {
    bytes value = 1;
    uint64 offset = 2;
}

service Log {
    rpc Consume(ConsumeRequest) returns (ConsumeResponse) {}
    rpc Produce(ProduceRequest) returns (ProduceResponse) {}
    // The client sends one starting offset; the server streams records from it onward.
    rpc ConsumeStream(ConsumeRequest) returns (stream ConsumeResponse){}
    // The client streams records; the server streams back each record's assigned offset.
    rpc ProduceStream(stream ProduceRequest) returns (stream ProduceResponse){}
}

message ProduceRequest {
    Record record = 1;
}

message ProduceResponse {
    uint64 offset = 1;
}

message ConsumeRequest {
    uint64 offset = 1;
}

message ConsumeResponse {
    Record record = 1;
}


