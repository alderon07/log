syntax = "proto3";

package log.v1;

option go_package = "github.com/alderon07/log/api/v1";

message Record {
    bytes value = 1;
    uint64 offset = 2;
}

service Log {
    rpc Consume(ConsumeRequest) returns (ConsumeResponse) {}
    rpc Produce(ProduceRequest) returns (ProduceResponse) {}
    rpc ConsumeStream(ConsumeRequest) returns (stream ConsumeRequest){}
    rpc ProduceStream(ProduceRequest) returns (stream ProduceResponse){}
}




